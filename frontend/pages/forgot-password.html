<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your Duto account password." />
    <title>Forgot Password — Duto</title>
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="auth-layout">
      <div class="auth-card">
        <div class="auth-header">
          <a href="../index.html" class="logo"
            >Dut<span class="logo-accent">o</span></a
          >
          <h1 class="text-xl mt-4">Reset password</h1>
          <p class="text-sm text-secondary mt-2">
            Enter your email and we'll send you a reset link
          </p>
        </div>

        <form id="forgot-password-form" action="#" method="post">
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <input
              type="email"
              id="forgot-email"
              name="email"
              placeholder="you@university.edu"
              required
              autocomplete="email"
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="forgot-submit-button"
          >
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Remember your password?
            <a href="login.html" id="back-to-login-link">Back to login</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
