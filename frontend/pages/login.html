<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Log in to Duto — your student productivity platform."
    />
    <title>Login — Duto</title>
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="auth-layout">
      <div class="auth-card">
        <div class="auth-header">
          <a href="../index.html" class="logo"
            >Dut<span class="logo-accent">o</span></a
          >
          <h1 class="text-xl mt-4">Welcome back</h1>
          <p class="text-sm text-secondary mt-2">
            Log in to continue to your workspace
          </p>
        </div>

        <form id="login-form" action="#" method="post">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="you@university.edu"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>
          <a
            href="forgot-password.html"
            class="forgot-link"
            id="forgot-password-link"
            >Forgot password?</a
          >
          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="login-submit-button"
          >
            Log In
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Don't have an account?
            <a href="signup.html" id="signup-link">Sign up</a>
          </p>
        </div>
      </div>
    </div>
    <script src="../scripts/utilities.js"></script>
    <script src="../scripts/settings/themeManager.js"></script>
    <script src="../scripts/authentication/authenticationManager.js"></script>
    <script src="../scripts/authentication/login.js"></script>
  </body>
</html>
