<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Duto-AI — Your AI-powered study assistant."
    />
    <title>Duto-AI — Duto</title>
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("duto_theme") || '"light"');
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-layout">
      <aside class="app-sidebar" id="app-sidebar">
        <div class="sidebar-logo">
          <a href="dashboard.html" class="logo"
            >Dut<span class="logo-accent">o</span></a
          >
        </div>
        <nav class="sidebar-nav" aria-label="Application navigation">
          <ul class="sidebar-nav-list">
            <li class="sidebar-nav-item">
              <a href="dashboard.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-house" aria-hidden="true"></i
                ></span>
                Dashboard</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="task.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-list-check" aria-hidden="true"></i
                ></span>
                Tasks</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="projects.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-folder-open" aria-hidden="true"></i
                ></span>
                Projects</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="teams.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-users" aria-hidden="true"></i
                ></span>
                Teams</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="notifications.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-bell" aria-hidden="true"></i
                ></span>
                Notifications</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="messages.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-comments" aria-hidden="true"></i
                ></span>
                Messages</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="calendar.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-calendar-days" aria-hidden="true"></i
                ></span>
                Calendar</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="schedule.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-calendar-week" aria-hidden="true"></i
                ></span>
                Schedule</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="notes.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-note-sticky" aria-hidden="true"></i
                ></span>
                Notes</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="calculator.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-calculator" aria-hidden="true"></i
                ></span>
                Calculator</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="pomodoro.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-clock" aria-hidden="true"></i
                ></span>
                Pomodoro</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="duto-ai.html" class="active"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-robot" aria-hidden="true"></i
                ></span>
                Duto-AI</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="analytics.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-chart-line" aria-hidden="true"></i
                ></span>
                Analytics</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="settings.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-gear" aria-hidden="true"></i
                ></span>
                Settings</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="profile.html"
                ><span class="sidebar-nav-icon"
                  ><i class="fa-solid fa-user" aria-hidden="true"></i
                ></span>
                Profile</a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a
            href="login.html"
            class="btn btn-ghost btn-block btn-sm"
            id="logout-button"
            ><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            Log Out</a
          >
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="app-main">
        <header class="app-topbar">
          <button
            class="mobile-menu-toggle"
            id="mobile-menu-toggle"
            aria-label="Open menu"
            type="button"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <div class="flex-1"></div>
          <div class="topbar-actions">
            <button
              class="btn btn-ghost btn-icon"
              id="theme-toggle-button"
              type="button"
              aria-label="Toggle theme"
              title="Toggle theme"
            >
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
            <button
              class="btn btn-ghost btn-icon"
              id="notification-bell"
              type="button"
              aria-label="Notifications"
              title="Notifications"
            >
              <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </button>
            <a
              href="profile.html"
              class="btn btn-ghost btn-icon"
              id="topbar-profile-link"
              aria-label="Profile"
              title="Profile"
              ><i class="fa-solid fa-user" aria-hidden="true"></i
            ></a>
          </div>
        </header>

        <main class="app-content">
          <div class="page-header">
            <h1>Duto-AI</h1>
            <p></p>
          </div>

          <div class="card" style="margin-bottom: 1rem">
            <h2 class="card-title">Groq API key</h2>
            <p class="text-sm text-muted" style="margin-bottom: 0.75rem">
              <a
                href="https://console.groq.com/keys"
                target="_blank"
                rel="noopener"
                >Get a free key at</a
              >.
            </p>
            <div class="form-group">
              <label for="groq-api-key">API key</label>
              <input
                type="password"
                id="groq-api-key"
                class="form-control"
                placeholder="gsk_..."
                autocomplete="off"
              />
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                id="save-api-key-btn"
              >
                Save key
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                id="clear-api-key-btn"
              >
                Clear key
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                id="toggle-key-visibility"
              >
                Show / hide
              </button>
            </div>
            <p
              id="api-key-status"
              class="text-sm text-muted"
              style="margin-top: 0.5rem"
            ></p>
          </div>

          <div class="chat-container" id="stud-ai-chat">
            <div class="chat-messages" id="chat-messages"></div>
            <form
              class="chat-input-row"
              id="ai-chat-form"
              style="display: flex; gap: 0.5rem; margin-top: 0.75rem"
            >
              <input
                type="text"
                id="ai-user-input"
                class="form-control"
                placeholder="Ask a study question..."
                style="flex: 1"
              />
              <button
                type="submit"
                class="btn btn-primary btn-sm"
                id="ai-send-btn"
              >
                Send
              </button>
            </form>
            <button
              type="button"
              class="btn btn-ghost btn-sm"
              id="clear-chat-btn"
              style="margin-top: 0.5rem"
            >
              Clear chat
            </button>
          </div>
        </main>
      </div>
    </div>

    <script src="../scripts/utilities.js"></script>
    <script src="../scripts/ui/toast.js"></script>
    <script src="../scripts/ui/modal.js"></script>
    <script src="../scripts/authentication/authenticationManager.js"></script>
    <script src="../scripts/settings/themeManager.js"></script>
    <script src="../scripts/app.js"></script>
    <script src="../scripts/duto-ai/dutoAi.js"></script>
  </body>
</html>
