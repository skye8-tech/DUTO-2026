    <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("duto_theme") || '"light"');
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>

                ><span class="sidebar-nav-icon"><i class="fa-solid fa-folder-open" aria-hidden="true"></i></span> Projects</a

            <li class="sidebar-nav-item">
              <a href="teams.html"
                ><span class="sidebar-nav-icon"><i class="fa-solid fa-users" aria-hidden="true"></i></span> Teams</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="notifications.html"
                ><span class="sidebar-nav-icon"><i class="fa-solid fa-bell" aria-hidden="true"></i></span> Notifications</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="messages.html" class="active"
                ><span class="sidebar-nav-icon"><i class="fa-solid fa-comments" aria-hidden="true"></i></span> Messages</a
              >
            </li>
<li class="sidebar-nav-item">
              <a href="calendar.html"
                ><span class="sidebar-nav-icon"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></span> Calendar</a
              >
            </li>
            <li class="sidebar-nav-item">
              <a href="schedule.html"
                ><span class="sidebar-nav-icon"><i class="fa-solid fa-calendar-week" aria-hidden="true"></i></span> Schedule</a

        <div class="sidebar-footer">
          <a
            href="login.html"
            class="btn btn-ghost btn-block btn-sm"
            id="logout-button"
            ><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Log Out</a
          >
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- Main -->
      <div class="app-main">
        <header class="app-topbar">
          <button
            class="mobile-menu-toggle"
            id="mobile-menu-toggle"
            aria-label="Open menu"
            type="button"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <div class="flex-1"></div>
          <div class="topbar-actions">
            <button
              class="btn btn-ghost btn-icon"
              id="theme-toggle-button"
              type="button"
              aria-label="Toggle theme"
              title="Toggle theme"
            >
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
            <button
              class="btn btn-ghost btn-icon"
              id="notification-bell"
              type="button"
              aria-label="Notifications"
              title="Notifications"
            >
              <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </button>
            <a
              href="profile.html"
              class="btn btn-ghost btn-icon"
              id="topbar-profile-link"
              aria-label="Profile"
              title="Profile"
              ><i class="fa-solid fa-user" aria-hidden="true"></i
            ></a>
          </div>
        </header>

        <main class="app-content">
          <div class="page-header">
            <h1>Messages</h1>
            <p>Chat with other Duto users on this device.</p>
          </div>
          
          <div class="card">
            <div style="display:grid;grid-template-columns:220px 1fr;gap:1rem;">
              <div>
                <input type="search" id="msg-user-search" class="form-control" placeholder="Search users..." style="margin-bottom:0.75rem;" />
                <div id="msg-user-list"></div>
              </div>
              <div>
                <h2 class="card-title" id="msg-chat-title">Select a person</h2>
                <div id="msg-thread" style="min-height:280px;max-height:360px;overflow-y:auto;border:1px solid var(--border-color,#e5e7eb);border-radius:12px;padding:1rem;margin-bottom:0.75rem;"></div>
                <form id="msg-form" class="hidden" style="display:flex;gap:0.5rem;">
                  <input type="text" id="msg-input" class="form-control" placeholder="Type a message..." required style="flex:1;" />
                  <button type="submit" class="btn btn-primary btn-sm">Send</button>
                </form>
              </div>
            </div>
          </div>

</main>
      </div>
    </div>

    <script src="../scripts/utilities.js"></script>
